<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="The online home of Steiner Artisan Farm.">
    <title>Steiner Artisan Farm</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, "Times New Roman", serif;
        color: #263b2c;
        background: #f5f2e8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      main {
        width: min(100%, 48rem);
        padding: clamp(2rem, 8vw, 5rem);
        text-align: center;
        background: #fffdf7;
        border: 1px solid #d9dfd2;
        border-radius: 1rem;
        box-shadow: 0 1rem 3rem rgb(38 59 44 / 8%);
      }

      p {
        margin: 0;
        color: #57705a;
        font-family: Arial, sans-serif;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 1.25rem 0;
        font-size: clamp(2.5rem, 9vw, 4.5rem);
        line-height: 1.05;
      }

      main > span {
        display: block;
        max-width: 28rem;
        margin: 0 auto;
        color: #596459;
        font-family: Arial, sans-serif;
        font-size: 1.1rem;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Welcome to</p>
      <h1>Steiner Artisan Farm</h1>
      <span>A new online home is taking root. Please check back soon. test</span>
    </main>
  </body>
</html>
